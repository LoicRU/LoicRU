<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-label="Loïc Ruyssen — Creative Technologist: software, security, creative experiments">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0C"/><stop offset="1" stop-color="#121216"/></linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { .motion-loop { display: none; } }
  </style>
  <rect width="1200" height="296" rx="16" fill="url(#bg)"/>

  <text x="72" y="116" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#F5F5F2">Loïc Ruyssen</text>
  <rect x="72" y="138" width="0" height="5" rx="2.5" fill="#7C5CFF"><animate attributeName="width" values="0;180" keyTimes="0;1" calcMode="spline" keySplines="0.22 1 0.36 1" dur="0.9s" begin="0.15s" fill="freeze"/></rect>
  <text x="72" y="184" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9A9AA2">Creative Technologist — Software · Security · Creative Experiments</text>
  <text x="72" y="230" font-family="'SFMono-Regular','Consolas','Liberation Mono',monospace" font-size="16" fill="#6E6E78">// Epitech — Software Engineering</text>

  <!-- constellation: one abstract mark per flagship project, linked as a loose network -->
  <g stroke="#2E2E36" stroke-width="1.2" opacity="0.55" fill="none">
    <line x1="900" y1="70" x2="1000" y2="110"/>
    <line x1="1000" y1="110" x2="1060" y2="55"/>
    <line x1="1000" y1="110" x2="1120" y2="150"/>
    <line x1="1120" y1="150" x2="970" y2="230"/>
    <line x1="970" y1="230" x2="880" y2="180"/>
    <line x1="880" y1="180" x2="900" y2="70"/>
    <line x1="1060" y1="55" x2="950" y2="40"/>
  </g>
  <g class="motion-loop" opacity="0.55" fill="none">
    <path d="M1060 55 L950 40" stroke="#7C5CFF" stroke-width="1.4" stroke-dasharray="118" stroke-dashoffset="118"><animate attributeName="stroke-dashoffset" values="118;0" dur="1.1s" begin="0.4s" fill="freeze"/></path>
  </g>

  <circle cx="1000" cy="110" r="3" fill="#9A9AA2"/>
  <circle cx="880" cy="180" r="3" fill="#9A9AA2"/>
  <circle cx="950" cy="40" r="3" fill="#9A9AA2"/>
  <g class="motion-loop">
    <circle cx="1000" cy="110" r="3" fill="#7C5CFF" opacity="0"><animate attributeName="opacity" values="0;0.65;0" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- AgentDrift — triangle -->
  <path d="M900 52 L916 81 L884 81 Z" fill="none" stroke="#7C5CFF" stroke-width="3" stroke-linejoin="round"/>

  <!-- AUREN — hexagon -->
  <path d="M1074 55 L1067 42.88 L1053 42.88 L1046 55 L1053 67.12 L1067 67.12 Z" fill="none" stroke="#7C5CFF" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Mosalea — two linked circles -->
  <circle cx="1120" cy="150" r="16" fill="none" stroke="#7C5CFF" stroke-width="2.5"/>
  <circle cx="1130" cy="160" r="6" fill="#7C5CFF"/>

  <!-- Better Wiki — diamond -->
  <path d="M970 214 L986 230 L970 246 L954 230 Z" fill="none" stroke="#7C5CFF" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
