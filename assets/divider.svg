<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 16" width="880" height="16" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#00ff9c" stop-opacity="0.45"/>
      <stop offset="88%"  stop-color="#00ff9c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .scan { animation: sc 5.5s cubic-bezier(.4,0,.6,1) infinite; }
      .dash { animation: dd 1.8s linear infinite; }
      @keyframes sc { 0% { transform: translateX(-60px) } 100% { transform: translateX(940px) } }
      @keyframes dd { to { stroke-dashoffset: -18 } }
    </style>
  </defs>
  <line x1="0" y1="8" x2="880" y2="8" stroke="url(#d)" stroke-width="1.2"/>
  <line class="dash" x1="0" y1="8" x2="880" y2="8" stroke="#00ff9c" stroke-width="1.2" stroke-dasharray="1.5 16.5" opacity="0.7"/>
  <g class="scan">
    <circle cx="0" cy="8" r="2.8" fill="#00ff9c" filter="url(#g)"/>
    <rect x="-46" y="7.3" width="46" height="1.4" fill="url(#d)" opacity="0.9"/>
  </g>
</svg>
